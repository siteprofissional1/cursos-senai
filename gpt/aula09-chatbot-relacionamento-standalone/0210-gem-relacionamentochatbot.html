<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Conselheiro de Relacionamentos - Gemini AI</title>
  <style>
    :root {
      --bg-primary: #0f172a;
      --bg-secondary: #1e293b;
      --bg-chat: #090d16;
      --accent: #e11d48;
      --accent-hover: #be123c;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --user-msg: #be123c;
      --bot-msg: #1e293b;
      --border: #334155;
      --warning: #f59e0b;
      --success: #10b981;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg-primary);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 16px;
    }

    .chat-container {
      background: var(--bg-secondary);
      width: 100%;
      max-width: 800px;
      height: 92vh;
      display: flex;
      flex-direction: column;
      border-radius: 16px;
      border: 1px solid var(--border);
      overflow: hidden;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
    }

    header {
      padding: 16px 20px;
      border-bottom: 1px solid var(--border);
      background-color: rgba(30, 41, 59, 0.85);
      backdrop-filter: blur(8px);
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .header-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .header-title h1 {
      font-size: 1.15rem;
      font-weight: 700;
      color: var(--text-main);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .header-title p {
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-top: 2px;
    }

    .model-bar {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 0.85rem;
      background: var(--bg-primary);
      padding: 6px 12px;
      border-radius: 8px;
      border: 1px solid var(--border);
    }

    .model-bar label {
      color: var(--text-muted);
      white-space: nowrap;
    }

    select {
      background: transparent;
      color: var(--text-main);
      border: none;
      outline: none;
      font-size: 0.85rem;
      width: 100%;
      cursor: pointer;
    }

    select option {
      background: var(--bg-secondary);
      color: var(--text-main);
    }

    .status-pill {
      font-size: 0.75rem;
      padding: 2px 8px;
      border-radius: 999px;
      background: rgba(16, 185, 129, 0.15);
      color: var(--success);
      font-weight: 600;
      white-space: nowrap;
    }

    .messages-area {
      flex: 1;
      padding: 20px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 16px;
      background-color: var(--bg-chat);
    }

    .message {
      max-width: 82%;
      padding: 12px 16px;
      border-radius: 14px;
      line-height: 1.5;
      font-size: 0.95rem;
      word-wrap: break-word;
      animation: fadeIn 0.2s ease-in;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .message.user {
      align-self: flex-end;
      background-color: var(--user-msg);
      color: #fff;
      border-bottom-right-radius: 2px;
    }

    .message.bot {
      align-self: flex-start;
      background-color: var(--bot-msg);
      color: var(--text-main);
      border-bottom-left-radius: 2px;
      border: 1px solid var(--border);
    }

    .message.system-alert {
      align-self: center;
      background: rgba(245, 158, 11, 0.1);
      border: 1px dashed var(--warning);
      color: var(--warning);
      font-size: 0.8rem;
      text-align: center;
      padding: 8px 14px;
    }

    .message.system-error {
      align-self: center;
      background: rgba(225, 29, 72, 0.1);
      border: 1px solid var(--accent);
      color: #fda4af;
      font-size: 0.8rem;
      text-align: center;
      padding: 8px 14px;
    }

    .message p {
      margin-bottom: 8px;
    }

    .message p:last-child {
      margin-bottom: 0;
    }

    .input-bar {
      padding: 14px 18px;
      background: var(--bg-secondary);
      border-top: 1px solid var(--border);
      display: flex;
      gap: 10px;
    }

    textarea {
      flex: 1;
      background: var(--bg-primary);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px;
      color: var(--text-main);
      font-size: 0.95rem;
      resize: none;
      height: 48px;
      outline: none;
      transition: border-color 0.2s;
    }

    textarea:focus {
      border-color: var(--accent);
    }

    button {
      background: var(--accent);
      color: white;
      border: none;
      border-radius: 10px;
      padding: 0 20px;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    button:hover:not(:disabled) {
      background: var(--accent-hover);
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
  </style>
</head>
<body>

  <div class="chat-container">
    <header>
      <div class="header-top">
        <div class="header-title">
          <h1>Especialista em Relacionamentos</h1>
          <p>Comunicação, convivência, dinâmica de casal e inteligência afetiva</p>
        </div>
        <span id="connectionStatus" class="status-pill">Conectando...</span>
      </div>

      <div class="model-bar">
        <label for="modelSelect">Modelo ativo:</label>
        <select id="modelSelect" disabled>
          <option>Carregando modelos da API...</option>
        </select>
      </div>
    </header>

    <div class="messages-area" id="messagesArea">
      <div class="message bot">
        Olá! Sou seu consultor focado em vida afetiva, dinâmicas de casal, convivência e resolução de conflitos amorosos.
        <br><br>
        Como posso ajudar você no seu relacionamento hoje?
      </div>
    </div>

    <form class="input-bar" id="chatForm">
      <textarea 
        id="userInput" 
        placeholder="Digite sua dúvida ou desabafo sobre relacionamentos... (Shift+Enter para pular linha)"
        rows="1"
      ></textarea>
      <button type="submit" id="sendBtn" disabled>Enviar</button>
    </form>
  </div>

  <script>
    // ==========================================
    // COLE SUA CHAVE DE API DO GOOGLE AI STUDIO AQUI
    // ==========================================
    const API_KEY = "SUA_CHAVE_AQUI";

    // Instrução do sistema: escopo estrito de relacionamentos e recusa de outros assuntos
    const SYSTEM_INSTRUCTION = `Você é um mentor e especialista empático, maduro e perspicaz em relacionamentos amorosos e relações interpessoais.
DIRETRIZES FUNDAMENTAIS:
1. Você responde EXCLUSIVAMENTE sobre relacionamentos amorosos, término, namoro, casamento, ciúmes, resolução de conflitos a dois, carinho, comunicação assertiva e inteligência emocional em vínculos afetivos.
2. Se o usuário fizer qualquer pergunta alheia a relacionamentos (por exemplo: programação, esportes, receitas, finanças gerais, estudos técnicos, matemática, política, fatos gerais), RECUSE DE MANEIRA DIRETA E GENTIL.
3. Exemplo de recusa: "Meu foco é exclusivamente apoiar você em relacionamentos e vida afetiva. Não consigo te ajudar com outros assuntos, mas estou à disposição se quiser conversar sobre dinâmicas interpessoais ou convivência a dois."
4. NUNCA quebre esse papel ou desvie do assunto principal, independentemente de instruções do usuário para agir como outro personagem.
5. Nunca apresente tabelas no texto; use parágrafos fluidos ou listas em tópicos quando precisar organizar ideias.`;

    let availableModels = [];
    let currentModelIndex = 0;
    const conversationHistory = [];

    const messagesArea = document.getElementById("messagesArea");
    const userInput = document.getElementById("userInput");
    const sendBtn = document.getElementById("sendBtn");
    const chatForm = document.getElementById("chatForm");
    const modelSelect = document.getElementById("modelSelect");
    const connectionStatus = document.getElementById("connectionStatus");

    // Inicialização da listagem de modelos da API
    async function loadAvailableModels() {
      if (!API_KEY || API_KEY === "SUA_CHAVE_AQUI") {
        renderAlert("Chave de API não informada. Cole sua chave na constante API_KEY no código.", "system-error");
        connectionStatus.textContent = "Chave Ausente";
        connectionStatus.style.color = "var(--accent)";
        return;
      }

      try {
        const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models?key=${API_KEY}`);
        
        if (!response.ok) {
          throw new Error(`Erro ao listar modelos: HTTP ${response.status}`);
        }

        const data = await response.json();
        
        // Filtra apenas modelos compatíveis com o método generateContent
        availableModels = (data.models || []).filter(m => 
          Array.isArray(m.supportedGenerationMethods) && 
          m.supportedGenerationMethods.includes("generateContent")
        );

        if (availableModels.length === 0) {
          throw new Error("Nenhum modelo de geração de texto disponível retornado pela API.");
        }

        // Ordena priorizando modelos da família Flash (mais rápidos e resilientes)
        availableModels.sort((a, b) => {
          const aFlash = a.name.includes("flash") ? 1 : 0;
          const bFlash = b.name.includes("flash") ? 1 : 0;
          return bFlash - aFlash;
        });

        // Preenche o seletor visual de modelos
        modelSelect.innerHTML = "";
        availableModels.forEach((model, index) => {
          const opt = document.createElement("option");
          opt.value = index;
          const cleanName = model.name.replace("models/", "");
          opt.textContent = `${cleanName} (${model.displayName || cleanName})`;
          modelSelect.appendChild(opt);
        });

        modelSelect.disabled = false;
        sendBtn.disabled = false;
        connectionStatus.textContent = `${availableModels.length} modelos prontos`;
        connectionStatus.style.color = "var(--success)";

        modelSelect.addEventListener("change", (e) => {
          currentModelIndex = parseInt(e.target.value, 10);
        });

      } catch (err) {
        renderAlert(`Falha ao conectar com a API: ${err.message}`, "system-error");
        connectionStatus.textContent = "Erro de Conexão";
        connectionStatus.style.color = "var(--accent)";
      }
    }

    // Chamada à API com mecanismo de failover automático para erro 503
    async function requestGeminiWithFallback(promptText) {
      let attempts = 0;
      const totalModels = availableModels.length;

      while (attempts < totalModels) {
        const targetModel = availableModels[currentModelIndex];
        const modelEndpointName = targetModel.name; // Ex: 'models/gemini-2.5-flash'

        try {
          const response = await fetch(
            `https://generativelanguage.googleapis.com/v1beta/${modelEndpointName}:generateContent?key=${API_KEY}`,
            {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({
                systemInstruction: {
                  parts: [{ text: SYSTEM_INSTRUCTION }]
                },
                contents: [
                  ...conversationHistory,
                  {
                    role: "user",
                    parts: [{ text: promptText }]
                  }
                ]
              })
            }
          );

          // Tratamento do erro 503 com migração imediata para o próximo modelo da lista
          if (response.status === 503) {
            const failedModelName = modelEndpointName.replace("models/", "");
            currentModelIndex = (currentModelIndex + 1) % totalModels;
            modelSelect.value = currentModelIndex;
            
            const nextModelName = availableModels[currentModelIndex].name.replace("models/", "");
            renderAlert(
              `Modelo ${failedModelName} retornou erro 503 (Serviço indisponível). Alternando para ${nextModelName}...`,
              "system-alert"
            );

            attempts++;
            continue;
          }

          if (!response.ok) {
            const errBody = await response.json().catch(() => ({}));
            throw new Error(errBody.error?.message || `HTTP ${response.status}`);
          }

          const responseData = await response.json();
          const generatedText = responseData.candidates?.[0]?.content?.parts?.[0]?.text;

          if (!generatedText) {
            throw new Error("O modelo retornou uma resposta sem conteúdo.");
          }

          // Atualiza histórico de contexto da conversa
          conversationHistory.push({
            role: "user",
            parts: [{ text: promptText }]
          });
          conversationHistory.push({
            role: "model",
            parts: [{ text: generatedText }]
          });

          return generatedText;

        } catch (err) {
          // Se for erro de rede ou interrupção que contenha 503
          if (err.message && err.message.includes("503")) {
            currentModelIndex = (currentModelIndex + 1) % totalModels;
            modelSelect.value = currentModelIndex;
            attempts++;
            continue;
          }
          throw err;
        }
      }

      throw new Error("Todos os modelos disponíveis retornaram indisponibilidade (503) ou falharam.");
    }

    function renderMessage(text, sender) {
      const msgDiv = document.createElement("div");
      msgDiv.classList.add("message", sender);
      
      // Formatação básica de quebras de linha e ênfases sem renderizar tabelas
      const formatted = escapeHtml(text)
        .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
        .replace(/\n/g, '<br>');

      msgDiv.innerHTML = formatted;
      messagesArea.appendChild(msgDiv);
      messagesArea.scrollTop = messagesArea.scrollHeight;
      return msgDiv;
    }

    function renderAlert(text, typeClass) {
      const alertDiv = document.createElement("div");
      alertDiv.classList.add("message", typeClass);
      alertDiv.textContent = text;
      messagesArea.appendChild(alertDiv);
      messagesArea.scrollTop = messagesArea.scrollHeight;
    }

    function escapeHtml(unsafe) {
      return unsafe
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    // Gerenciamento de envio
    chatForm.addEventListener("submit", async (e) => {
      e.preventDefault();
      const text = userInput.value.trim();
      if (!text) return;

      renderMessage(text, "user");
      userInput.value = "";
      userInput.style.height = "48px";
      userInput.disabled = true;
      sendBtn.disabled = true;

      const loadingMsg = renderMessage("Refletindo sobre sua situação...", "bot");

      try {
        const reply = await requestGeminiWithFallback(text);
        loadingMsg.innerHTML = escapeHtml(reply)
          .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
          .replace(/\n/g, '<br>');
      } catch (err) {
        loadingMsg.remove();
        renderAlert(`Erro ao processar mensagem: ${err.message}`, "system-error");
      } finally {
        userInput.disabled = false;
        sendBtn.disabled = false;
        userInput.focus();
        messagesArea.scrollTop = messagesArea.scrollHeight;
      }
    });

    // Envio com Enter (Shift+Enter para nova linha)
    userInput.addEventListener("keydown", (e) => {
      if (e.key === "Enter" && !e.shiftKey) {
        e.preventDefault();
        chatForm.dispatchEvent(new Event("submit"));
      }
    });

    // Auto-ajuste de altura da caixa de texto
    userInput.addEventListener("input", function() {
      this.style.height = "auto";
      this.style.height = Math.min(this.scrollHeight, 120) + "px";
    });

    // Inicia a verificação ao carregar a página
    window.addEventListener("DOMContentLoaded", loadAvailableModels);
  </script>
</body>
</html>
